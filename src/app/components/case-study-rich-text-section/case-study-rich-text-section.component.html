<section class="container-page section-lg case-study-section stack-sm">
  @if (section().kicker) {
    <p class="label-sm text-muted">{{ section().kicker }}</p>
  }
  <h2 class="headline-lg text-primary">{{ section().heading }}</h2>
  <div class="stack-sm">
    @for (paragraph of section().body; track $index) {
      <p class="body-lg text-muted case-study-paragraph">{{ paragraph }}</p>
    }
  </div>
</section>
