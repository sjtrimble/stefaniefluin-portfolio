<section class="container-page section-lg case-study-section stack-sm">
  <h2 class="headline-lg text-primary">{{ section().heading }}</h2>
  <div class="grid-3 case-study-metrics-grid">
    @for (item of section().items; track item.label) {
      <article class="card case-metric stack-xs">
        <p class="label-sm text-muted">{{ item.label }}</p>
        <p class="headline-md text-primary case-metric-value">{{ item.value }}</p>
        <p class="body-md text-muted">{{ item.detail }}</p>
      </article>
    }
  </div>
</section>
