<section class="container-page section-xl stack-md">
  <header class="stack-xs">
    <h1 class="headline-xl text-primary">Work</h1>
    <p class="body-lg text-muted">
      A collection of product, design systems, and design engineering work.
    </p>
  </header>

  <div class="grid-12 gap-md">
    @for (caseStudy of caseStudies; track caseStudy.slug) {
      <article class="card col-6 stack-sm p-sm">
        <img class="case-image" [src]="caseStudy.heroImage" [alt]="caseStudy.heroImageAlt" />
        <h2 class="headline-md text-primary">{{ caseStudy.title }}</h2>
        <p class="body-md text-muted">{{ caseStudy.subtitle }}</p>
        <p class="label-sm text-muted">{{ caseStudy.client }} | {{ caseStudy.timeline }}</p>
        <a [routerLink]="['/case-study', caseStudy.slug]" class="btn btn-ghost label-sm">
          Read Case Study <span aria-hidden="true">&rarr;</span>
        </a>
      </article>
    }
  </div>
</section>
